[theme]
base = "dark"
primaryColor = "#6366F1"
backgroundColor = "#090D16"
secondaryBackgroundColor = "#0F172A"
textColor = "#F8FAFC"
font = "sans serif"

[client]
toolbarMode = "minimal"
showErrorDetails = true

[server]
enableCORS = false
enableXsrfProtection = true
maxUploadSize = 50

[browser]
gatherUsageStats = false
